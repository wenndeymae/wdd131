<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Submit a product review including rating, features, and feedback.">
  <meta name="author" content="Wenndey Mae Ubatay">
  <title>Product Review Form</title>
  <link rel="stylesheet" href="styles/form.css">
</head>

<body>

<header>
  <h1>Product Review</h1>
</header>

<main>
  <form method="get" action="review.html">

    <!-- Product Name -->
    <label for="product">Product Name</label>
    <select id="product" name="product" required>
      <option value="" disabled selected>Select a Product ...</option>
    </select>

    <!-- Rating -->
    <fieldset>
      <legend>Overall Rating</legend>
      <label><input type="radio" name="rating" value="1" required> ☆</label>
      <label><input type="radio" name="rating" value="2"> ☆☆</label>
      <label><input type="radio" name="rating" value="3"> ☆☆☆</label>
      <label><input type="radio" name="rating" value="4"> ☆☆☆☆</label>
      <label><input type="radio" name="rating" value="5"> ☆☆☆☆☆</label>
    </fieldset>

    <!-- Date -->
    <label for="date">Date of Installation</label>
    <input type="date" id="date" name="date" required>

    <!-- Features -->
    <fieldset>
      <legend>Useful Features</legend>
      <label for="durable">
        <input type="checkbox" id="durable" name="features" value="durable"> Durable
      </label>

      <label for="easy">
        <input type="checkbox" id="easy" name="features" value="easy"> Easy to Use
      </label>

      <label for="design">
        <input type="checkbox" id="design" name="features" value="design"> Good Design
      </label>

      <label for="value">
        <input type="checkbox" id="value" name="features" value="value"> Good Value
      </label>
    </fieldset>

    <!-- Review -->
    <label for="review">Written Review</label>
    <textarea id="review" name="review"></textarea>

    <!-- Name -->
    <label for="username">Your Name</label>
    <input type="text" id="username" name="username">

    <!-- Submit -->
    <input type="submit" value="Submit Review">

  </form>
</main>

<footer>
  <p>&copy; <span id="year"></span> Wenndey Mae Ubatay, Philippines</p>
  <p id="lastModified"></p>
</footer>

<script src="scripts/form.js" defer></script>
</body>
</html>
