<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Browse Japan tour packages and explore travel options across top destinations like Tokyo, Kyoto, and Osaka.">
<meta name="author" content="Wenndey Mae Ubatay">
<title>Review a Tour</title>

<link rel="stylesheet" href="form.css">
<script src="form.js" defer></script>
</head>

<body>

<header>
  <h1>Review a Japan Tour</h1>

  <nav>
    <a href="project.html">Home</a>
    <a href="tours.html">Tours</a>
    <a href="form.html">Review a Tour</a>
  </nav>
</header>

<main>

<p><span class="required">*</span> indicates required fields</p>

<form method="get" action="review.html">

<label for="tour">Tour Package <span class="required">*</span></label>
<select id="tour" name="tour" required>
  <option value="" disabled selected>Select a Tour</option>
</select>

<fieldset>
<legend>Rating <span class="required">*</span></legend>

<input type="radio" name="rating" value="1" required id="r1">
<label for="r1">1 ⭐</label>
<input type="radio" name="rating" value="2" required id="r2">
<label for="r2">2 ⭐</label>
<input type="radio" name="rating" value="3" required id="r3">
<label for="r3">3 ⭐</label>
<input type="radio" name="rating" value="4" required id="r4">
<label for="r4">4 ⭐</label>
<input type="radio" name="rating" value="5" required id="r5">
<label for="r5">5 ⭐</label>

</fieldset>

<label for="date">Travel Date <span class="required">*</span></label>
<input type="date" id="date" name="date" required>

<label for="review">Your Experience</label>
<textarea id="review" name="review"></textarea>

<label for="name">Your Name</label>
<input type="text" id="name" name="name">

<input type="submit" value="Submit Review">

</form>

</main>

<footer>
  <p>&copy; 2026 Wenndey Mae Ubatay</p>
</footer>

</body>
</html>
